# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR review (PLAN F6d.4, DECISIONS D-067). CodeRabbit reads this file from the PR's head branch.
# The CLAUDE.md files are read automatically as code guidelines, each for its own directory; the instructions
# below add only what they don't say. Reviews advise: they never block a merge (D-067 (2)).
language: tr
tone_instructions: "Kısa ve somut ol: dosya/satır, sorun, düzeltme. Övgü ve özet tekrarı yazma."

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Generated by tools; reviewed through their sources (the model, the endpoints, the package graph).
    - "!**/Migrations*/*.Designer.cs"
    - "!**/Migrations*/*ModelSnapshot.cs"
    - "!**/packages.lock.json"
    - "!docs/openapi/v1.json"
  path_instructions:
    - path: "docs/plan/**"
      instructions: >-
        Plan belgeleri Türkçe ve öncelik sırası DECISIONS.md > PLAN.md > PROGRESS.md > CLAUDE.md. Bir D/Y satırı
        silinmez ya da yeniden yazılmaz: üstü çizilir ve yerine gelen yeni ID'yi gösterir ("Kalıcı kararların
        revizyonu"). Atıf yapılan her D-/Y-/R-/Q- ID'sinin var olduğunu ve söylenenle uyuştuğunu kontrol et.
    - path: "src/Templates/**/content/**"
      instructions: >-
        Template content is not compiled in this repository; only `bash eng/template-smoke.sh` builds it. Check that
        it mirrors the repository change it copies (the same standards, D-040 (5)) and that template symbols
        (`--auth BuiltIn|External`, `--db SqlServer|PostgreSql`, the `MyService` source name, D-040 (4), D-075) stay
        consistent.
    - path: "**/Migrations*/*.cs"
      instructions: >-
        EF Core writes these files. Review only that the migration matches the model change in the same PR, that each
        provider's set got one (SQL Server in the host, PostgreSQL in tests/NovaCore.Api.Tests/PostgreSql and the
        template's MigrationsPostgreSql folders, D-073…D-075) and that it keeps the schema per module; don't suggest
        style changes.
  pre_merge_checks:
    docstrings:
      # CS1591 already fails the build for undocumented public members of the packages.
      mode: "off"
    title:
      mode: warning
      requirements: "English, imperative, under 72 characters; a phase PR starts with its phase id (e.g. `faz6e: ...`)."
    description:
      mode: warning
    issue_assessment:
      # The repository tracks work in docs/plan, not in issues.
      mode: "off"
    custom_checks:
      - name: "Yapılmayacaklar (Y-list)"
        mode: warning
        instructions: >-
          Fail if the change adds anything listed under "Yapılmayacaklar" in docs/plan/DECISIONS.md: e.g. MediatR,
          AutoMapper, FluentAssertions or any mediator/request-dispatch abstraction (Y-01, Y-43), a package that is not
          MIT/Apache-2.0 or Microsoft and is not a named exception in DECISIONS (Y-47: Polly.* transitively, D-052; a
          project's database provider recorded by name, D-068), a generic repository/unit of work over EF Core (Y-15), assembly-scanning
          registration (Y-20), EF InMemory or a mocked DbSet in tests (Y-32), lazy-loading proxies (Y-33). Name the Y-ID.
      - name: "Bastırma gerekçesi (Y-46)"
        mode: warning
        instructions: >-
          Fail if the change adds a warning suppression (`NoWarn`, `WarningsNotAsErrors`, `#pragma warning disable`,
          `[SuppressMessage]`, or an `.editorconfig` severity lowered to none/silent/suggestion) unless one of these
          holds: (a) Microsoft's "When to suppress warnings" section for that rule explicitly allows it, the
          suppression is permanent (not "for now"), and it carries a justification and an R- or D-entry as its source;
          or (b) a D- or Q-entry records the user's approval of that suppression. Separately, fail if a test is
          skipped, deleted or weakened (fewer assertions, looser expectations) without a D- or Q-entry recording the
          user's approval; a Microsoft quote does not cover tests.
      - name: "Geçici kod yok (Y-38, Y-45)"
        mode: warning
        instructions: >-
          Fail if the change adds TODO/FIXME/HACK comments, or code, configuration or suppressions described as
          temporary ("şimdilik", "geçici", "remove in phase X", "for now"). Remaining work belongs in
          docs/plan/PROGRESS.md under "Sonraya bırakılanlar".
      - name: "Belgeler değişiklikle uyumlu"
        mode: warning
        instructions: >-
          Fail if the change alters a convention, command, public API or configuration key that CLAUDE.md, a nested
          CLAUDE.md, README.md or the template under src/Templates/**/content describes, and the PR does not update
          that description or copy. A PR on a `faz/` branch must also update docs/plan/PROGRESS.md.
  finishing_touches:
    simplify:
      enabled: true

knowledge_base:
  code_guidelines:
    filePatterns:
      # Added to the defaults (**/CLAUDE.md, ...): the decision log, which every change must respect.
      - files: "docs/plan/DECISIONS.md"
        applyTo: "**"
  learnings:
    scope: local
