name: CI

on:
  push:
  pull_request:

# Every job states what it needs; the workflow grants nothing by default.
permissions: {}

# A newer push to a pull request supersedes its running build. Every pushed commit gets its own group, so a push never
# cancels (or, while queued, is replaced by) another push's run: each commit on main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a full commit SHA, with the release it was resolved from in the comment.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The NovaCore packages come from GitHub Packages (nuget.config). Store a token with read:packages as the repository
      # secret NOVACORE_PACKAGES_TOKEN; NuGet reads the "novacore" source's credentials from this variable. Only the
      # steps that reach the feed get it. A high or critical vulnerability in any package fails restore (NuGet audit).
      - name: Restore
        env:
          NuGetPackageSourceCredentials_novacore: Username=${{ github.actor }};Password=${{ secrets.NOVACORE_PACKAGES_TOKEN }}
        run: dotnet restore

      # Every package, transitive ones included, is MIT or Apache-2.0 licensed or a named exception of this project
      # (eng/check-licenses.sh).
      - name: Package licenses
        run: bash eng/check-licenses.sh

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      # Each module owns a DbContext; the host keeps every context's migrations. A model change without a migration fails
      # here.
      - name: Migrations match the model
        run: |
          dotnet tool restore
          api=src/Api/MyService.Api
          dotnet ef migrations has-pending-model-changes --project "$api" --startup-project "$api" \
            --context TodosDbContext --configuration Release --no-build
#if (BuiltInAuth)
          dotnet ef migrations has-pending-model-changes --project "$api" --startup-project "$api" \
            --context IdentityServerDbContext --configuration Release --no-build
#endif
#if (multitenancy)
          dotnet ef migrations has-pending-model-changes --project "$api" --startup-project "$api" \
            --context MultiTenancyDbContext --configuration Release --no-build
#endif

      # One migration bundle per DbContext: an executable that applies the migrations at deployment time, run as a
      # one-shot job by an account with schema rights (efbundle --connection "..."); the application's own account needs
      # none. Framework-dependent, so the job runs where the app's .NET runtime is (add --self-contained otherwise, at
      # about twice the size). Built for pushes to the default branch only: each bundle is tens of megabytes of artifact
      # storage. Change the runtime to your deployment target.
      - name: Migration bundles
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          ASPNETCORE_ENVIRONMENT: Production
          NuGetPackageSourceCredentials_novacore: Username=${{ github.actor }};Password=${{ secrets.NOVACORE_PACKAGES_TOKEN }}
        run: |
          api=src/Api/MyService.Api
          dotnet ef migrations bundle --project "$api" --startup-project "$api" --context TodosDbContext \
            --configuration Release --target-runtime linux-x64 --output artifacts/migrations/todos/efbundle
#if (BuiltInAuth)
          dotnet ef migrations bundle --project "$api" --startup-project "$api" --context IdentityServerDbContext \
            --configuration Release --target-runtime linux-x64 --output artifacts/migrations/identity/efbundle
#endif
#if (multitenancy)
          dotnet ef migrations bundle --project "$api" --startup-project "$api" --context MultiTenancyDbContext \
            --configuration Release --target-runtime linux-x64 --output artifacts/migrations/tenancy/efbundle
#endif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          name: migration-bundles
          path: artifacts/migrations
          retention-days: 7

      # `dotnet list package --vulnerable` exits 0 even when it finds advisories, so its JSON output is checked instead.
      # Any severity fails the build.
      - name: No vulnerable packages
        env:
          NuGetPackageSourceCredentials_novacore: Username=${{ github.actor }};Password=${{ secrets.NOVACORE_PACKAGES_TOKEN }}
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[]] | length == 0' vulnerable.json \
            || { cat vulnerable.json; exit 1; }
