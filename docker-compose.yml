# Optional local dependencies for NovaCore.
#   docker compose up -d
# By default NovaCore targets a LOCAL SQL Server via Windows auth (see appsettings.json), so you
# typically don't need the sqlserver service below — it's here only if you prefer a container.
# Seq (logs) and Jaeger (traces) are opt-in: set Seq:ServerUrl / OTEL_EXPORTER_OTLP_ENDPOINT.

services:
  # Optional containerized SQL Server. The SA password is read from a git-ignored .env file next to
  # this one (docker compose loads it automatically), e.g.  MSSQL_SA_PASSWORD='<strong-password>'
  # If you use this instead of a local instance, set (via user-secrets, never in appsettings):
  #   ConnectionStrings:Database =
  #   "Server=localhost,1433;Database=NovaCore;User Id=sa;Password=<MSSQL_SA_PASSWORD>;TrustServerCertificate=True;Encrypt=True;"
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: novacore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - novacore-mssql:/var/opt/mssql

  # Structured log UI. Enable by setting Seq:ServerUrl=http://localhost:5341
  seq:
    image: datalust/seq:latest
    container_name: novacore-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"   # ingestion
      - "8081:80"     # web UI -> http://localhost:8081

  # Distributed tracing UI. Enable by setting OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: novacore-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # web UI -> http://localhost:16686
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  novacore-mssql:
