name: Scorecard

# OpenSSF Scorecard: supply-chain checks of the repository (pinned dependencies, token permissions, branch protection,
# ...). Results go to the Security tab and to the public Scorecard API (docs/plan/DECISIONS.md D-042, D-051 (5)). The
# action supports push and schedule on the default branch only.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  branch_protection_rule:

# Publishing the results requires that the workflow itself grants no write permission.
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Signs the published results; only this job may have it.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard
