name: Release

# Packs the NuGet packages and pushes them to GitHub Packages when a v* tag is pushed (docs/plan/DECISIONS.md D-013).
# The version comes from VersionPrefix in Directory.Build.props. The tag must name that same version; anything after
# the first '-' becomes the prerelease suffix: v0.1.0 -> 0.1.0, v0.1.0-preview.1 -> 0.1.0-preview.1.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Fails before anything is built if the tag and Directory.Build.props disagree, so a package can never ship under
      # a version the code doesn't declare.
      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          prefix="${tag%%-*}"
          suffix=""
          if [[ "$tag" == *-* ]]; then suffix="${tag#*-}"; fi
          expected="$(dotnet msbuild src/BuildingBlocks/NovaCore.Core.Abstractions/NovaCore.Core.Abstractions.csproj -getProperty:VersionPrefix)"
          if [[ "$prefix" != "$expected" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $expected in Directory.Build.props."
            exit 1
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore NovaCore.slnx

      # The suffix is passed to build too, so the assemblies' informational version matches the package version.
      - name: Build
        run: dotnet build NovaCore.slnx -c Release --no-restore -p:VersionSuffix=${{ steps.version.outputs.suffix }}

      - name: Test
        run: dotnet test NovaCore.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack NovaCore.slnx -c Release --no-build -o artifacts -p:VersionSuffix=${{ steps.version.outputs.suffix }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Only .nupkg: GitHub Packages rejects .snupkg symbol packages (R-039), which stay in the workflow artifact above.
      # The feed is passed here instead of through setup-dotnet's source-url, which would add it to the restore sources
      # too (R-043).
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
          --no-symbols
