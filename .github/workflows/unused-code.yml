name: Unused code

# Roslynator's report of the internal and private types, fields, constants and events nothing references
# (docs/plan/DECISIONS.md D-066, eng/find-unused.sh). A report, not a gate: weekly and on demand, in the job summary.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions: {}

# A run is never cancelled by another: it is a weekly report.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  roslynator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NovaCore.slnx --locked-mode

      - name: Unused symbols
        run: bash eng/find-unused.sh
