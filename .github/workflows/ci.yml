name: CI

on:
  push:
  pull_request:

# Every job states what it needs; the workflow grants nothing by default.
permissions: {}

# A newer push to a pull request supersedes its running build. Every pushed commit gets its own group, so a push never
# cancels (or, while queued, is replaced by) another push's run: each commit on main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a full commit SHA, with the release it was resolved from in the comment (docs/plan/DECISIONS.md
# D-051).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet audit runs here: high/critical advisories (NU1903/NU1904), transitive included, are errors
      # (Directory.Build.props). Locked mode: a package graph that differs from the committed packages.lock.json files
      # fails instead of being resolved anew (docs/plan/RESEARCH.md R-094).
      - name: Restore
        run: dotnet restore NovaCore.slnx --locked-mode

      # Every package in the restored graph, transitive ones included, has an allowed license (Y-06, D-052).
      - name: Package licenses
        run: bash eng/check-licenses.sh

      - name: Build
        run: dotnet build NovaCore.slnx -c Release --no-restore

      # Whitespace, usings and the code style .editorconfig sets, as `dotnet format NovaCore.slnx` would fix them. Line
      # endings are git's business (the index is LF), so .editorconfig doesn't set end_of_line.
      - name: Formatting
        run: dotnet format NovaCore.slnx --verify-no-changes --no-restore

      # The tests, with the line and branch coverage held to eng/coverage-baseline.txt (docs/plan/DECISIONS.md D-060). The
      # SQL Server tests run in a container (Docker is on the runner); without Docker they would skip, and --fail-skips
      # makes a skipped test fail the run (D-056).
      - name: Test with coverage
        run: bash eng/check-coverage.sh Release

      # For the sonar job: the same run's coverage, so it doesn't run the tests again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: TestResults/coverage/coverage.cobertura.*.xml
          retention-days: 1

      # Without coverage: coverlet instruments the built assemblies, and these tests inspect their references.
      - name: Architecture tests
        run: dotnet test --project tests/NovaCore.Api.Tests -c Release --no-build -- --filter-namespace NovaCore.Api.Tests.Architecture

      # Each module owns a DbContext, and the host owns the identity provider's; a model change without a migration
      # fails here.
      - name: EF Core model matches migrations
        run: |
          dotnet tool restore
          for module in Catalog Payments; do
            project="src/Modules/$module/NovaCore.Modules.$module"
            dotnet ef migrations has-pending-model-changes \
              --project "$project" --startup-project "$project" --context "${module}DbContext" \
              --configuration Release --no-build
          done
          dotnet ef migrations has-pending-model-changes \
            --project src/Api/NovaCore.Api --startup-project src/Api/NovaCore.Api --context IdentityServerDbContext \
            --configuration Release --no-build

      # `dotnet list package --vulnerable` exits 0 even when it finds advisories (docs/plan/RESEARCH.md R-027),
      # so its JSON output is checked instead. Any severity fails the build.
      - name: No vulnerable packages
        run: |
          dotnet list NovaCore.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[]] | length == 0' vulnerable.json \
            || { cat vulnerable.json; exit 1; }

  # Whether this run has a SONAR_TOKEN. A fork, Dependabot's runs and a repository not set up for SonarQube Cloud have
  # none, and the sonar job then doesn't run. Pushes only: a pull request's push already ran it.
  sonar-token:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      present: ${{ steps.check.outputs.present }}

    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: if [[ -n "$SONAR_TOKEN" ]]; then echo present=true; else echo present=false; fi >> "$GITHUB_OUTPUT"

  # SonarQube Cloud's analysis (docs/plan/DECISIONS.md D-045): its scanner wraps a build, and build-and-test's coverage
  # goes with it. The scanner runs here only, never as a package reference (SonarAnalyzer.CSharp's license is not MIT or
  # Apache, Y-06). The begin step also turns warnings-as-errors off, which is why this is a job of its own.
  sonar:
    needs: [build-and-test, sonar-token]
    if: needs.sonar-token.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SONAR_SCANNER_VERSION: 12.0.0

    steps:
      # The whole history: SonarQube Cloud attributes new code and issues by blame.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: TestResults/coverage

      - name: Restore
        run: dotnet restore NovaCore.slnx --locked-mode

      - name: Install the scanner
        run: dotnet tool install dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION" --tool-path "$RUNNER_TEMP/sonar"

      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "$RUNNER_TEMP/sonar/dotnet-sonarscanner" begin /k:"alimuhammedak_NovaCore" /o:"alimuhammedak" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.cobertura.reportsPaths="TestResults/coverage/coverage.cobertura.*.xml" \
            /d:sonar.exclusions="**/Migrations/**"
          dotnet build NovaCore.slnx -c Release --no-restore --no-incremental
          "$RUNNER_TEMP/sonar/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"

  # The committed OpenAPI document (docs/openapi/v1.json, kept current by OpenApiContractTests) against the base
  # revision's: a breaking change fails unless eng/openapi-breaking-accepted.txt accepts it (oasdiff from an image pinned
  # by digest, docs/plan/DECISIONS.md D-061). The full history gives the branch point from main.
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Breaking changes
        run: bash eng/check-openapi.sh

  # The template as a consumer gets it (docs/plan/PLAN.md F5.2): every package packed into a local feed, a project created
  # with each --auth option, then built with warnings as errors, tested and checked against its migrations. The project
  # restores the packages from that feed, never from this repository's projects.
  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Template smoke test
        run: bash eng/template-smoke.sh "$RUNNER_TEMP/template-smoke"

      # The template's workflow only becomes YAML once the template engine has removed its #if lines, so it is linted
      # in the projects the smoke test generated.
      - name: Lint the generated projects' workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/lint-workflows.sh "$RUNNER_TEMP"/template-smoke/projects/*

  # Secrets in the whole git history, every branch and tag fetched: Betterleaks 1.9.0 with .betterleaks.toml (default
  # rules plus the reviewed test credentials), found values redacted in the log. The pre-commit hook in .githooks scans
  # staged changes the same way (docs/plan/DECISIONS.md D-051 (4)).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release archive is checked against the SHA-256 from its checksums.txt before it runs.
      - name: Install Betterleaks
        env:
          BETTERLEAKS_VERSION: 1.9.0
          BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v$BETTERLEAKS_VERSION/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$BETTERLEAKS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/betterleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/betterleaks" betterleaks
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"

      - name: Scan the history
        run: betterleaks git . --redact --no-banner

  # The repository's own workflows and Dependabot configuration: actionlint for syntax and expressions, zizmor for
  # security. Any finding fails the job.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/lint-workflows.sh
