name: CI

on:
  push:
  pull_request:

# Every job states what it needs; the workflow grants nothing by default.
permissions: {}

# A newer push to the same ref supersedes a running pull-request build; pushes to a branch or tag each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a full commit SHA, with the release it was resolved from in the comment (docs/plan/DECISIONS.md
# D-051).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet audit runs here: high/critical advisories (NU1903/NU1904), transitive included, are errors
      # (Directory.Build.props). Locked mode: a package graph that differs from the committed packages.lock.json files
      # fails instead of being resolved anew (docs/plan/RESEARCH.md R-094).
      - name: Restore
        run: dotnet restore NovaCore.slnx --locked-mode

      - name: Build
        run: dotnet build NovaCore.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NovaCore.slnx -c Release --no-build

      # Each module owns a DbContext, and the host owns the identity provider's; a model change without a migration
      # fails here.
      - name: EF Core model matches migrations
        run: |
          dotnet tool restore
          for module in Catalog Payments; do
            project="src/Modules/$module/NovaCore.Modules.$module"
            dotnet ef migrations has-pending-model-changes \
              --project "$project" --startup-project "$project" --context "${module}DbContext" \
              --configuration Release --no-build
          done
          dotnet ef migrations has-pending-model-changes \
            --project src/Api/NovaCore.Api --startup-project src/Api/NovaCore.Api --context IdentityServerDbContext \
            --configuration Release --no-build

      # `dotnet list package --vulnerable` exits 0 even when it finds advisories (docs/plan/RESEARCH.md R-027),
      # so its JSON output is checked instead. Any severity fails the build.
      - name: No vulnerable packages
        run: |
          dotnet list NovaCore.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[]] | length == 0' vulnerable.json \
            || { cat vulnerable.json; exit 1; }

  # The template as a consumer gets it (docs/plan/PLAN.md F5.2): every package packed into a local feed, a project created
  # with each --auth option, then built with warnings as errors, tested and checked against its migrations. The project
  # restores the packages from that feed, never from this repository's projects.
  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Template smoke test
        run: bash eng/template-smoke.sh "$RUNNER_TEMP/template-smoke"

      # The template's workflow only becomes YAML once the template engine has removed its #if lines, so it is linted
      # in the projects the smoke test generated.
      - name: Lint the generated projects' workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/lint-workflows.sh "$RUNNER_TEMP"/template-smoke/projects/*

  # The repository's own workflows and Dependabot configuration: actionlint for syntax and expressions, zizmor for
  # security. Any finding fails the job.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/lint-workflows.sh
